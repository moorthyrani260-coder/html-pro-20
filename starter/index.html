<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Survey Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #eef5f0;
            padding: 30px 15px;
            color: #26352b;
        }

        form {
            max-width: 550px;
            margin: 0 auto;
            padding: 30px;
            background-color: white;
            border: 1px solid #d5e5d8;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #247447;
            font-size: 180%;
            margin-bottom: 25px;
            text-align: center;
        }

        h2 {
            color: #247447;
            font-size: 115%;
            padding: 12px 0;
            margin: 12px 0;
            border-bottom: 1px solid #d5e5d8;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #344b3a;
        }

        input[type="email"],
        input[type="text"] {
            width: 100%;
            padding: 11px;
            border: 1px solid #b8c9bc;
            border-radius: 6px;
            font-size: 100%;
            background-color: #fcfefd;
        }

        input[type="email"]:focus,
        input[type="text"]:focus {
            outline: 2px solid #70b58b;
            border-color: #247447;
        }

        .checkbox-group {
            margin: 10px 0;
        }

        .checkbox-group label {
            display: inline;
            font-weight: normal;
            cursor: pointer;
        }

        input[type="checkbox"] {
            margin-right: 8px;
            accent-color: #247447;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        input[type="submit"],
        input[type="reset"] {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 100%;
            font-weight: bold;
            cursor: pointer;
        }

        input[type="submit"] {
            background-color: #247447;
            color: white;
        }

        input[type="submit"]:hover {
            background-color: #185a34;
        }

        input[type="reset"] {
            background-color: #e3e9e4;
            color: #26352b;
        }

        input[type="reset"]:hover {
            background-color: #cdd8cf;
        }

        .thank-you {
            text-align: center;
            margin-top: 25px;
            color: #247447;
            font-size: 110%;
        }

        @media screen and (max-width: 480px) {
            form {
                padding: 20px;
            }

            h1 {
                font-size: 150%;
            }
        }
    </style>
</head>

<body>

    <form name="myform" action="survey_data.html" method="get">

        <h1>Customer Survey</h1>

        <h2>Contact Information</h2>

        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" name="email" id="email"
                   autocomplete="email" autofocus required>
        </div>

        <div class="form-group">
            <label for="firstname">First Name:</label>
            <input type="text" name="firstname" id="firstname"
                   autocomplete="given-name" required>
        </div>

        <div class="form-group">
            <label for="lastname">Last Name:</label>
            <input type="text" name="lastname" id="lastname"
                   autocomplete="family-name" required>
        </div>

        <h2>Geographic Information</h2>

        <div class="form-group">
            <label for="state">State:</label>
            <input type="text" name="state" id="state"
                   placeholder="Two characters"
                   pattern="[A-Za-z]{2}"
                   title="Enter exactly two letters"
                   maxlength="2" required>
        </div>

        <div class="form-group">
            <label for="zip">ZIP Code:</label>
            <input type="text" name="zip" id="zip"
                   placeholder="Five digits"
                   pattern="[0-9]{5}"
                   title="Enter exactly five digits"
                   maxlength="5" required>
        </div>

        <h2>How Did You Hear About Us?</h2>

        <div class="checkbox-group">
            <input type="checkbox" name="web" id="web" value="web">
            <label for="web">Web Search</label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" name="facebook" id="facebook" value="facebook">
            <label for="facebook">Facebook</label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" name="twitter" id="twitter" value="twitter">
            <label for="twitter">Twitter</label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" name="message" id="message" value="message">
            <label for="message">Email Message</label>
        </div>

        <h2 class="thank-you">Thank You for Taking Our Survey!</h2>

        <div class="buttons">
            <input type="submit" name="register" value="Submit">
            <input type="reset" name="reset" value="Clear Form">
        </div>

    </form>

</body>
</html>
